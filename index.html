<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>切半</title>
    <script type="module" crossorigin src="./assets/index-D9-iCjhR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BvGljHBT.css">
  </head>
  <body>
    <!-- 固定尺寸的画板（桌面 1280×720 / 手机 375×812），整体等比缩放进窗口；位置和尺寸由 theme.ts 设定（D041） -->
    <div id="viewport">
      <div id="board">
        <div id="graticule"></div>
        <header id="header">
          <button id="about-button" type="button"></button>
          <div id="counter"></div>
        </header>
        <div id="progress"></div>
        <div id="mode-chip"><span class="icon"></span><span class="label"></span></div>
        <div id="plate"></div>
        <div id="plate-corner"></div>
        <div id="ribbon"></div>
        <div id="hint"><span class="icon"></span><span class="text"><span class="main"></span><span class="sub"></span></span></div>
        <div id="deviation"></div>
        <div id="answer"></div>
        <div id="map-card"><canvas id="map"></canvas></div>
        <div id="source"></div>
        <button id="action" type="button" disabled></button>
        <canvas id="ui"></canvas>
        <!-- 总分页、数据说明页：画板内整页，内容由 main.ts 按 theme.ts 生成（D044） -->
        <div id="summary" hidden></div>
        <div id="about" hidden></div>
        <!-- 口令页（D046）：只在部署构建里出现 -->
        <div id="gate" hidden></div>
      </div>
    </div>
  </body>
</html>
